<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#e6ecf6;background:
 radial-gradient(circle at 85% 5%,#0e2547 0%,transparent 55%),
 radial-gradient(circle at 8% 92%,#0c2245 0%,transparent 60%),#0a0f17}
.top{position:absolute;top:44px;right:74px;left:74px;display:flex;align-items:center;justify-content:space-between}
.logo-tag{border:1px solid #3fc6f0;color:#3fc6f0;font-size:1.05rem;font-weight:800;letter-spacing:4px;padding:9px 20px;border-radius:8px}
.alttag{color:#5f7594;font-size:1rem;letter-spacing:2px}
.mid{position:absolute;top:88px;left:0;right:0;text-align:center}
.code{color:#8ba0bf;font-size:1.05rem;letter-spacing:5px;margin-bottom:18px}
.bio{width:150px;height:150px;border-radius:14px;background:#3a1016;border:5px solid #ff5a56;color:#ffd9d4;display:grid;place-items:center;font-size:5rem;margin:0 auto 14px;box-shadow:0 0 60px rgba(255,45,45,.4)}
.sig{color:#4a5a72;letter-spacing:14px;font-size:1.3rem;margin:12px 0 8px}
h1{font-size:5.6rem;font-weight:900;color:#fff;letter-spacing:8px}
.warn{margin:24px auto 0;display:inline-block;border:3px solid #ff5a56aa;background:#261018;color:#ffd9d4;border-radius:12px;padding:12px 26px;font-size:1.35rem;font-weight:800}
.bottom{position:absolute;bottom:52px;left:74px;right:74px;display:flex;align-items:center;justify-content:space-between;color:#7e93b1;font-size:1.1rem;letter-spacing:1px}
.bottom .sec{display:flex;gap:14px;align-items:center}
.bottom .dot{width:7px;height:7px;border-radius:50%;background:#37d4c0;box-shadow:0 0 8px #37d4c0}
.url{font-size:1rem;color:#3fc6f0;letter-spacing:0}
</style></head><body>
<div class="top"><span class="logo-tag">CIPHERVAULT</span><span class="alttag">LOCAL ENCRYPTED VAULT</span></div>
<div class="mid">
  <div class="code">LOCAL VAULT · DEVICE_01</div>
  <div class="bio">☣</div>
  <div class="sig">— — — — — — —</div>
  <h1>CIPHERVAULT</h1>
  <div class="warn">⚠️ منطقة محمية — تشفير AES-256</div>
</div>
<div class="bottom">
  <div class="sec"><span>AES-256</span><span class="dot"></span><span>محلي فقط</span><span class="dot"></span><span>٣ محاولات ثم قفل</span></div>
  <span class="url">khazina.manus.space</span>
</div>
</body></html>
