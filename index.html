<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f17">
<title>CIPHERVAULT | وصول آمن</title>
<meta name="description" content="CIPHERVAULT — خزنة كلمات مرور مشفرة محلياً. بياناتك لا تغادر جهازك.">
<meta property="og:type" content="website">
<meta property="og:title" content="CIPHERVAULT | وصول آمن">
<meta property="og:description" content="خزنة كلمات مرور مشفرة محلياً (AES-256). بياناتك لا تغادر جهازك.">
<meta property="og:image" content="https://alansariteach.github.io/khazina/khazina-og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;min-height:100vh;background:#0a0f17;color:#e6ecf6;font-family:'Segoe UI',Tahoma,sans-serif;line-height:1.65}
body{background:
 radial-gradient(circle at 82% 10%,#0e2547 0%,transparent 55%),
 radial-gradient(circle at 12% 92%,#0c2245 0%,transparent 60%),
 #0a0f17;}
.hd{position:sticky;top:0;background:#0c1420;border-bottom:1px solid #1d2b42;padding:9px 13px;display:flex;align-items:center;gap:9px}
.hd .lg{width:33px;height:33px;border-radius:8px;background:#101b30;border:1px solid #2a3f63;display:grid;place-items:center;font-size:1rem}
.hd b{color:#dbe6f5;font-size:.95rem}
.hd i{color:#5f7594;margin-inline-start:auto;font-size:.85rem}
.wrap{max-width:600px;margin:0 auto;padding:16px}
/* ===== شاشة الوصول (بيوهازارد) ===== */
.ac{text-align:center;margin-top:4px}
.ac .code{color:#8ba0bf;font-size:.78rem;letter-spacing:2px;margin-bottom:14px}
.bio{width:78px;height:78px;border-radius:3px;background:#3a1016;color:#ffd9d4;border:2px solid #ff5a56;display:grid;place-items:center;font-size:2.4rem;margin:0 auto 6px;box-shadow:0 0 26px rgba(255,45,45,.28)}
.bio span{font-weight:900}
.sig{color:#4a5a72;letter-spacing:6px;margin:8px 0 4px;font-size:.9rem}
.ac h1{font-size:1.9rem;font-weight:900;color:#fff;letter-spacing:2px;margin:2px 0 12px}
.formcard{background:#0f1830;border:1px solid #223455;border-radius:16px;padding:20px 18px;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.warn{border:1px solid #ff5a56aa;background:linear-gradient(135deg,#3a1016,#261018);color:#ffd9d4;border-radius:10px;padding:9px 13px;font-size:.8rem;font-weight:700;margin-bottom:14px;text-align:center;box-shadow:0 0 20px rgba(255,45,45,.15)}
label{display:block;color:#9fb4d0;font-size:.83rem;font-weight:600;margin:9px 0 6px}
input{width:100%;background:#0b1626;border:1px solid #2c4268;border-radius:9px;padding:12px;color:#e9f1fc;font-size:1.05rem;outline:none;letter-spacing:1px}
input:focus{border-color:#37d4c0;box-shadow:0 0 0 1px #37d4c077}
.btn{width:100%;background:linear-gradient(135deg,#0bbf9e,#0a8fd0);border:none;border-radius:11px;padding:13px;color:#03121c;font-weight:800;font-size:1rem;cursor:pointer;margin-top:11px}
.btn:active{transform:scale(.98)}
.err{color:#ff6a5e;font-weight:700;font-size:.9rem;min-height:18px;margin-top:5px}
.sec{display:flex;justify-content:center;gap:12px;margin-top:13px;color:#7e93b1;font-size:.76rem}
.sec b{width:5px;height:5px;border-radius:50%;background:#37d4c0;box-shadow:0 0 6px #37d4c0}
.tip{background:#0e1c34;border:1px dashed #2c4268;border-radius:9px;padding:9px 12px;color:#93a8c6;font-size:.79rem;margin-top:16px;line-height:1.6;text-align:center}
/* ===== الخزنة ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:#0e1c34;border:1px solid #223455;border-radius:11px;padding:8px 11px;margin-bottom:12px}
.toolbar input{flex:1;min-width:96px;padding:9px;font-size:.95rem}
.t{display:inline-block;padding:5px 10px;background:transparent;border:none;color:#3fc6f0;font-weight:700;font-size:.86rem;cursor:pointer}
.entry{display:flex;align-items:center;border:1px solid #223455;border-radius:11px;padding:11px 13px;margin-bottom:8px;background:#0f1830;cursor:pointer}
.entry .ic{width:36px;height:36px;border-radius:9px;background:#12203a;color:#3fc6f0;display:grid;place-items:center;font-weight:800}
.entry .tx{flex:1;min-width:0}.entry .tx b{display:block;color:#e6ecf6}.entry .tx small{color:#7e93b1}
.cp{background:none;border:1px solid #223455;border-radius:8px;color:#3fc6f0;padding:6px 10px;font-size:.84rem;cursor:pointer}
.empty{color:#7e93b1;text-align:center;padding:18px}
.flist{background:#0f1830;border:1px solid #223455;border-radius:14px;padding:14px 12px}
.modal{position:fixed;inset:0;background:rgba(4,8,14,.6);display:none;align-items:center;justify-content:center;z-index:40}
.modal .box{background:#101b30;border:1px solid #223455;border-radius:16px;width:94%;max-width:520px;max-height:90%;overflow:auto;padding:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gridbtns{display:flex;gap:8px;align-items:center;margin-top:11px}
.gridbtns .t{padding:6px 12px}
.locked{background:#24060a;border:2px solid #ff5a56;border-radius:15px;padding:18px;text-align:center}
.locked p{color:#ffd9d4;font-size:1rem;line-height:1.7;margin-bottom:6px}
.toast{position:fixed;bottom:18px;inset-inline:0;background:rgba(10,26,46,.94);color:#fff;border-radius:11px;padding:10px 18px;display:none;max-width:380px;z-index:99;margin:0 auto;text-align:center}
@media(max-width:520px){.f2{grid-template-columns:1fr;padding:6px}}
</style>
</head>
<body>
<header class="hd"><span class="lg">🔐</span><b>CIPHERVAULT</b><i id="mstat">— وصول آمن</i></header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var enc=new TextEncoder(), dec=new TextDecoder(), ITER=600000;
var K='khazina_vault', LK='khazina_lock', MK='khazina_mastercfg';
var mem={key:null,kind:null,entries:[],lockUntil:0};

function el(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){var t=el('toast');t.textContent=m;t.style.display='block';window.clearTimeout(toast._t);toast._t=window.setTimeout(function(){t.style.display='none';},1700);}
function setStat(s){el('mstat').textContent=' — '+s;}
function screen(h){el('app').innerHTML=h;}
function lockRead(){try{return JSON.parse(localStorage.getItem(LK)||'null');}catch(e){return null;}}
function lockSave(o){try{localStorage.setItem(LK,JSON.stringify(o));}catch(e){}}
function cfgRead(){var r=null;try{r=localStorage.getItem(MK);}catch(e){} if(!r)return null; try{return JSON.parse(atob(r));}catch(e){return null;}}
function vaultRaw(){var r=null;try{r=localStorage.getItem(K);}catch(e){} if(!r)return null; try{return JSON.parse(atob(r));}catch(e){return null;}}

function derive(pw,salt){var pk=crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveBits']);return pk.then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:ub64(salt),iterations:ITER},k,256);});}
function b64(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b)));}
function ub64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function aesk(key){return crypto.subtle.importKey('raw',key,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);}
function E(key,p){var iv=crypto.getRandomValues(new Uint8Array(12));return aesk(key).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,enc.encode(p));}).then(function(ct){return {iv:b64(iv),ct:b64(ct)};});}
function D(key,b){return aesk(key).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(b.iv)},k,ub64(b.ct));}).then(function(pt){return dec.decode(pt);});}
function sha1hex(t){return crypto.subtle.digest('SHA-1',enc.encode(t)).then(function(d){return Array.prototype.map.call(new Uint8Array(d),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}

/* ===== التنسيق ===== */
function bioHead(extra){return '<div class="ac"><div class="code">LOCAL VAULT · DEVICE_01</div>'+
  '<div class="bio"><span>☣</span></div><div class="sig">— — — — —</div><h1>CIPHERVAULT</h1>'+(extra||'')+'</div>';}

function setup(mode){
  mem.kind=mode||(cfgRead()?'open':'create');
  var creating=(mem.kind==='create');
  setStat(creating?'إنشاء الخزنة':'فتح الخزنة');
  screen('<div class="formcard">'+bioHead(
    '<div class="warn">⚠️ منطقة محمية — خزنة مشفرة AES-256</div>'+
    (creating?'<p style="color:#8ba0bf;font-size:.9rem;margin-bottom:12px">أنشئ كلمة مرور رئيسية من 12 حرفاً على الأقل. لا يمكن استعادتها أبداً.</p>'
            :'<p style="color:#8ba0bf;font-size:.9rem;margin-bottom:12px">أدخل رمزك الرئيسي للمتابعة.</p>')+
    '<label>كلمة المرور الرئيسية</label><input type="password" id="mp" value="" autocomplete="off" placeholder="••••••••••••">'+
    (creating?'<label>تأكيد كلمة المرور</label><input type="password" id="mp2" value="" autocomplete="off" placeholder="أعد إدخال كلمة المرور">':'')+
    '<p class="err" id="err"></p>'+
    '<button class="btn" id="go">'+(creating?'إنشاء الخزنة':'فتح الخزنة')+'</button>'+
    '<div class="sec"><span>AES-256 · محلي فقط</span><b></b><span>٣ محاولات كحد أقصى</span></div>'+
    '<div class="tip">بياناتك مشفرة محلياً على هذا الجهاز. بعد 3 محاولات خاطئة يُقفل. <b>لا يمكن استرجاع كلمة المرور</b> — احفظها جيداً.</div>'
  )+'</div>');
  try{el('go').addEventListener('click',submit);}catch(e){}
  try{el('mp').addEventListener('keydown',function(ev){if(ev.key==='Enter')submit();});}catch(e){}
  if(!creating){try{el('mp2')&&0;}catch(e){}}
}

function submit(){
  var mode=mem.kind, p=el('mp').value, err=el('err');
  if(!p||!err){return;}
  if(mode==='create'){
    if(p.length<12){err.textContent='كلمة المرور قصيرة — الأقل 12 حرفاً';return;}
    if(p!==el('mp2').value){err.textContent='كلمتا المرور غير متطابقتين';return;}
    var salt=randomB64(16);
    derive(p,salt).then(function(bits){
      var key=new Uint8Array(bits); mem.key=key;
      E(key,'VERIFY').then(function(ver){
        mem.cfg={salt:salt,it:ITER,ver:ver}; mem.entries=[]; mem.kind='open';
        persist().then(function(){toast('تم إنشاء الخزنة');vault();});
      }).catch(function(){err.textContent='تعذر التشفير على هذا المتصفح';});
    }).catch(function(){err.textContent='تعذر التشفير على هذا المتصفح';});
    return;
  }
  var cfg=mem.cfg||cfgRead();
  if(!cfg){setup('create');return;}
  derive(p,cfg.salt).then(function(bits){
    var key=new Uint8Array(bits);
    D(key,cfg.ver).then(function(v){
      if(v!=='VERIFY')throw 0;
      mem.key=key;mem.kind='open';mem.lockUntil=0;
      lockSave({until:0,attempts:0});
      var raw=vaultRaw();
      if(raw){
        D(key,raw).then(function(dec){
          try{mem.entries=JSON.parse(dec).entries||[];}catch(e){mem.entries=[];}
          vault();
        }).catch(function(){mem.entries=[];vault();});
      }else{vault();}
    }).catch(function(){failAttempt();});
  }).catch(function(){failAttempt();});
}

function failAttempt(){
  var err=el('err'); if(!err)return;
  var l=lockRead()||{until:0,attempts:0};
  l.attempts=(l.attempts||0)+1;
  if(l.attempts>=3){l.until=Date.now()+15*60000;l.attempts=0;mem.lockUntil=l.until;}
  lockSave(l);
  if(mem.lockUntil>0){err.textContent='3 محاولات خاطئة — مقفل 15 دقيقة';home();}
  else{err.textContent='كلمة مرور غير صحيحة — المحاولة '+(l.attempts||1)+' من 3';try{var m=el('mp');m.value='';m.focus();}catch(e){}}
}

function persist(){
  return E(mem.key,JSON.stringify({v:1,entries:mem.entries})).then(function(en){
    localStorage.setItem(K,btoa(JSON.stringify(en)));
    localStorage.setItem(MK,btoa(JSON.stringify(mem.cfg)));
    return null;
  });
}

/* ===== الخزنة ===== */
function vault(){
  if(!mem.key){setup(cfgRead()?'open':'create');return;}
  setStat('مفتوح');
  var q=(el('q')?el('q').value:'').toLowerCase();
  var lst=mem.entries.filter(function(e){
    if(!q)return true;
    return (e.n||'').toLowerCase().indexOf(q)>-1||(e.u||'').toLowerCase().indexOf(q)>-1||(e.r||'').toLowerCase().indexOf(q)>-1;
  });
  screen('<div class="toolbar"><input id="q" placeholder="بحث بالاسم أو المستخدم أو الرابط" value="'+esc(q)+'" onkeyup="window.vaultApp.re()">'+
    '<button class="t" onclick="window.vaultApp.add()">＋</button><button class="t" onclick="window.vaultApp.exp()">تصدير</button>'+
    '<button class="t" onclick="window.vaultApp.imp()">استيراد</button><button class="t" onclick="window.vaultApp.lock()">قفل 🔒</button></div>'+
    '<div class="flist">'+(lst.length?lst.map(function(e){var i=mem.entries.indexOf(e);
      return '<div class="entry" onclick="window.vaultApp.edit('+i+')"><span class="ic">'+esc(e.n.trim().charAt(0)||'؟')+'</span>'+
        '<span class="tx"><b>'+esc(e.n)+'</b><small>'+esc((e.u||'')+' · '+((e.r||'').replace(/^https?:\/\//,'')))+'</small></span>'+
        '<button class="cp" onclick="event.stopPropagation();window.vaultApp.copy('+i+')">نسخ</button></div>';}).join('')
      :'<div class="empty">لا حسابات — اضغط (＋) لإضافة حساب</div>')+'</div>');
}

var vaultApp={
  re:function(){vault();},
  add:function(){vaultApp._e=null;vaultApp.openModal();},
  edit:function(i){vaultApp._e=mem.entries[i];vaultApp.openModal();},
  openModal:function(){
    var e=vaultApp._e||{n:'',u:'',r:'',p:'',notes:'',id:Date.now()};
    var m=el('modal'); if(!m){m=document.createElement('div');m.id='modal';m.className='modal';document.body.appendChild(m);}
    m.style.display='flex';
    m.innerHTML='<div class="box"><h3 style="margin:0 0 10px;color:#e6ecf6">'+(vaultApp._e?'تعديل حساب':'حساب جديد')+'</h3>'+
      (vaultApp._e?'':'<div style="background:#071018;border:1px solid #16263c;border-radius:9px;padding:9px 12px;color:#8ba0bf;font-size:.78rem;line-height:1.5;margin-bottom:10px">اقرأ التلميح: قفل + فحص تسريب ←</div>')+
      '<div class="f2">'+
        '<label>الموقع / التطبيق<input id="fn" value="'+esc(e.n)+'"></label>'+
        '<label>الرابط<input id="fr" value="'+esc(e.r)+'" placeholder="https://..."></label>'+
        '<label>اسم المستخدم<input id="fu" value="'+esc(e.u)+'"></label>'+
        '<label>كلمة المرور<input id="fp" value="'+esc(e.p)+'" style="direction:ltr"></label>'+
      '</div><label>ملاحظات<input id="fnotes" value="'+esc(e.notes)+'"></label>'+
      '<div class="gridbtns"><button class="t" onclick="window.vaultApp.gen()">مولّد</button>'+
        '<button class="t" onclick="window.vaultApp.leak()">فحص تسريب</button><span id="leakres" style="color:#9fb4d0;font-size:.8rem;flex:1"></span></div>'+
      '<div class="gridbtns">'+
        '<button class="t" onclick="window.vaultApp.closeM()">إلغاء</button>'+
        '<button class="t" style="background:#0bbf9e;color:#03121c;padding:8px 16px;border-radius:9px" onclick="window.vaultApp.save()">حفظ</button></div>'+
      (vaultApp._e?'<button class="t" style="color:#ff5a56;width:100%;text-align:center" onclick="window.vaultApp.del()">حذف الحساب</button>':'')+
      '</div>';
  },
  closeM:function(){var m=el('modal');if(m)m.style.display='none';},
  save:function(){
    var e={n:el('fn').value,u:el('fu').value,r:el('fr').value,p:el('fp').value,notes:el('fnotes').value};
    if(!e.n){toast('اكتب اسم الموقع');return;}
    if(vaultApp._e){e.id=vaultApp._e.id;var i=mem.entries.indexOf(vaultApp._e);mem.entries[i]=e;}
    else{e.id=Date.now();mem.entries.push(e);}
    persist();vaultApp.closeM();vault();
  },
  del:function(){if(vaultApp._e){mem.entries=mem.entries.filter(function(x){return x!==vaultApp._e;});persist();}vaultApp.closeM();vault();},
  copy:function(i){var w=navigator;if(w&&w.clipboard&&w.clipboard.writeText){w.clipboard.writeText(mem.entries[i].p).then(function(){toast('تم نسخ كلمة المرور');}).catch(function(){toast('تعذر النسخ');});}else{toast('تعذر النسخ');}},
  gen:function(){var c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+';var r=crypto.getRandomValues(new Uint8Array(18)),s='';for(var i=0;i<18;i++)s+=c[r[i]%c.length];el('fp').value=s;toast('كلمة مرور قوية مولّدة');},
  leak:function(){
    var p=el('fp').value,res=el('leakres');if(!p){res.textContent='اكتب كلمة المرور أولاً';return;}
    res.textContent='جارٍ الفحص…';
    sha1hex(p).then(function(h){var pre=h.slice(0,5).toUpperCase(),suf=h.slice(5).toUpperCase();
      devfetch('https://api.pwnedpasswords.com/range/'+pre).then(function(t){var cnt=0;t.split(/\r?\n/).forEach(function(ln){var x=ln.split(':');if(x[0].toUpperCase()===suf)cnt=parseInt(x[1],10);});res.textContent=cnt>0?('مسرّب '+cnt+' مرة — غيّرها'):'آمنة — ما انسربت';}).catch(function(){res.textContent='تعذر الفحص';});}).catch(function(){res.textContent='تعذر الفحص';});
  },
  lock:function(){mem.key=null;mem.kind=null;setStat('مقفل');home();},
  exp:function(){persist().then(function(){var raw='CIPHERVAULT\n';try{raw+=localStorage.getItem(K);}catch(e){}var a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(raw);a.download='khazina-backup-'+new Date().toISOString().slice(0,10)+'.txt';a.click();toast('تم تصدير النسخة (مشفرة)');});},
  imp:function(){var i=document.createElement('input');i.type='file';i.accept='.txt,text/plain';i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var L=String(r.result).split('\n');if(L[0]!=='CIPHERVAULT'||!L[1])throw 0;var b=JSON.parse(atob(L[1]));mem.entries=(b.entries||[]);persist().then(function(){toast('تم الاستيراد');});}catch(e){toast('ملف غير صالح');}};r.readAsText(f,'UTF-8');};i.click();}
};

function devfetch(url){return fetch(url).then(function(r){return r.text();});}

function home(){
  var now=Date.now();
  var l=lockRead();
  if(l&&l.until&&l.until>now){mem.lockUntil=l.until;}
  if(mem.lockUntil>now){
    setStat('مقفل');
    var mins=Math.max(1,Math.ceil((mem.lockUntil-now)/60000));
    screen('<div style="text-align:center;margin-top:30px"><div style="font-size:40px">🔒</div><h2 style="color:#fff;margin:10px 0">مقفل مؤقتاً</h2>'+
      '<div class="locked"><p>ثلاث محاولات خاطئة للرمز الرئيسي</p><p>الخزنة مقفلة لمدة <b>'+mins+' دقيقة</b>.</p></div></div>');
    window.setTimeout(home,30000);
    return;
  }
  if(!mem.key){setup(cfgRead()?'open':'create');return;}
  vault();
}

function randomB64(len){var b=crypto.getRandomValues(new Uint8Array(len));return btoa(String.fromCharCode.apply(null,b));}

window.vaultApp=vaultApp;
home();
})();
</script>
</body>
</html>
